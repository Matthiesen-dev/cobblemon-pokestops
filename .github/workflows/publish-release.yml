name: Publish Release to Modrinth

# Minimum Required Secrets:
# - MODRINTH_TOKEN (Modrinth API token with permissions to create versions)
# - MODRINTH_ID (The ID of the Modrinth project to publish to)
# - DISCORD_WEBHOOK_URL (The URL of the Discord webhook to send notifications to)

on:
  release:
    types: [ published ]

env:
  MOD_NAME: Cobblemon Pokestops
  ARTIFACT_BASENAME: cobblemon-pokestops
  RELEASE_JARS_ARTIFACT_PREFIX: release-jars
  FABRIC_LOADER_VERSION: '0.17.2+'
  NEOFORGE_LOADER_VERSION: '21.1.182+'
  MODRINTH_GAME_VERSION: 1.21.1
  MODRINTH_DEPENDENCIES: |-
    [
      {"project_id":"MdwFAVRL","dependency_type":"required"},
      {"project_id":"sqEZOmQo","dependency_type":"required"},
      {"project_id":"8BmcQJ2H","dependency_type":"required"},
      {"project_id":"nvQzSEkH","dependency_type":"optional"}
    ]
  DISCORD_ICON_URL: "https://raw.githubusercontent.com/Matthiesen-dev/.github/refs/heads/main/mod-logos/cobblemon-pokestops.png"

# The dependencies above correspond to:
# - Cobblemon (MdwFAVRL)
# - Matthiesen Core (sqEZOmQo)
# - Geckolib (8BmcQJ2H)
# - Jade (nvQzSEkH) - Optional
## Fabric Only:
# - Fabric API (P7dR8mSH) - Required
# - ForgeConfigAPI Port (ohNO6lps) - Required

jobs:
  publish:
    uses: matthiesen-dev/automation/.github/workflows/simple-publish.yml@main
    permissions:
      contents: write
    with:
      tag_name: ${{ github.event.release.tag_name }}
      artifact_basename: "cobblemon-pokestops"
      mod_name: "Cobblemon Pokestops"
      changelog: ${{ github.event.release.body }}
      fabric_loader_version: "0.17.2+"
      neoforge_loader_version: "21.1.182+"
      modrinth_game_version: "1.21.1"
      modrinth_id: "3clcaaoH"
      modrinth_dependencies: |-
        [
          {"project_id":"MdwFAVRL","dependency_type":"required"},
          {"project_id":"sqEZOmQo","dependency_type":"required"},
          {"project_id":"8BmcQJ2H","dependency_type":"required"},
          {"project_id":"nvQzSEkH","dependency_type":"optional"}
        ]
      modrinth_fabric_dependencies: |-
        [
          {"project_id":"P7dR8mSH","dependency_type":"required"},
          {"project_id":"ohNO6lps","dependency_type":"required"}
        ]
      discord_icon_url: "https://raw.githubusercontent.com/Matthiesen-dev/.github/refs/heads/main/mod-logos/cobblemon-pokestops.png"
    secrets:
      git_token: ${{ secrets.GITHUB_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
